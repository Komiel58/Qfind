<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCT問題・回答検索</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CCT問題・回答検索</h1>
        </header>
        
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="キーワードを入力してください..." class="search-input">
            <button id="searchButton" class="search-button">検索</button>
            <button id="clearButton" class="clear-button">クリア</button>
        </div>
        
        <div class="filter-section">
        </div>
        
        <div id="results" class="results-section">
            <p class="placeholder">検索結果がここに表示されます</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
