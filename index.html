<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCT問題・回答検索</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CCT問題・回答検索</h1>
        </header>
        
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="キーワードを入力してください..." class="search-input">
            <button id="searchButton" class="search-button">検索</button>
        </div>
        
        <div class="filter-section">
            <button id="createButton" class="create-button">新規作成</button>
        </div>
        
        <div id="results" class="results-section">
            <p class="placeholder">検索結果がここに表示されます</p>
        </div>
    </div>
    
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">新規作成</h2>
            <form id="itemForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="itemQuestion">問題:</label>
                    <textarea id="itemQuestion" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="itemAnswer">回答:</label>
                    <textarea id="itemAnswer" rows="5" required></textarea>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="submit-button">保存</button>
                    <button type="button" id="cancelButton" class="cancel-button">キャンセル</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
